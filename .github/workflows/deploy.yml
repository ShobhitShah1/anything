name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Check Pages configuration
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Explain missing Pages setup
        if: steps.pages.outcome == 'failure'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "::error::Enable Pages first: https://github.com/$REPOSITORY/settings/pages - under Build and deployment, set Source to GitHub Actions, then re-run this workflow."
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Check capture, previews, and sync
        run: node --test src/utils/*.test.mjs public/sw.test.mjs extension/*.test.mjs

      - name: Check product website and release configuration
        run: node website/check.mjs

      - name: Build production bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { readFirebaseConfig } from './src/utils/firebaseConfig.ts';
          if (!readFirebaseConfig(process.env)) {
            throw new Error('Missing Firebase web configuration. Set VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID and VITE_FIREBASE_APP_ID in Settings > Secrets and variables > Actions > Variables, then redeploy.');
          }
          NODE
          npm run build

      - name: Include product website and policies
        run: node website/pages.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
