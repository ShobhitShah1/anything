name: Deploy AI Worker

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anything-ai-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_CONSOLE_ORIGIN: ${{ vars.ADMIN_CONSOLE_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment settings
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID variable" && exit 1)
          test -n "$ADMIN_CONSOLE_ORIGIN" || (echo "Missing ADMIN_CONSOLE_ORIGIN variable" && exit 1)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/worker/package-lock.json
      - run: npm ci
        working-directory: apps/worker
      - run: npm run typecheck
        working-directory: apps/worker
      - run: npm test
        working-directory: apps/worker
      - name: Deploy Worker with the admin site's exact origin
        run: npm run deploy -- --var "ADMIN_CONSOLE_ORIGINS:${ADMIN_CONSOLE_ORIGIN}"
        working-directory: apps/worker
