<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script id="theme-init">
      (() => {
        let dark = false;
        try {
          const saved = localStorage.getItem('anything_theme');
          dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        } catch {}
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      })();
    </script>
    <style>html { background: #f4f5f7; color-scheme: light; } html.dark { background: #0d0d0f; color-scheme: dark; }</style>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=charcoal-1" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png?v=charcoal-1" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=charcoal-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Save links, notes, images, and ideas in Anything. Organize your finds into collections and quickly find what you saved." />
    <meta property="og:title" content="Anything — Save links, notes &amp; ideas" />
    <meta property="og:description" content="Keep your links, notes, images, and ideas together. Collect what matters and find it again with Anything." />
    <meta property="og:type" content="website" />
    <title>Anything — Save links, notes &amp; ideas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
